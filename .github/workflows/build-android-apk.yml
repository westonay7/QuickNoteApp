name: Build Signed Android APK (Bubblewrap TWA)

on:
  workflow_dispatch:
    inputs:
      pwa_url:
        description: 'Live PWA URL (leave blank to auto-detect your GitHub Pages URL)'
        required: false
        default: ''
      package_id:
        description: 'Android package ID'
        required: false
        default: 'io.github.westonay7.twa'
      app_version:
        description: 'Android versionName (e.g. 1.2.0)'
        required: false
        default: '1.2.0'
      app_version_code:
        description: 'Android versionCode (integer, increase for each update)'
        required: false
        default: '1'
      release_tag:
        description: 'Optional GitHub Release tag (e.g. v1.2.0) to also attach QuickNote-signed.apk'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Android SDK & build-tools
        id: android_sdk
        run: |
          set -euo pipefail
          ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$ANDROID_SDK" ]; then
            echo "::error::Android SDK directory was not found at $ANDROID_SDK."
            exit 1
          fi

          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager")"
          if [ -x "$SDKMANAGER" ]; then
            (yes || true) | "$SDKMANAGER" --sdk_root="$ANDROID_SDK" --licenses >/dev/null 2>&1 || true
            if [ ! -d "$ANDROID_SDK/platforms/android-36" ]; then
              (yes || true) | "$SDKMANAGER" --sdk_root="$ANDROID_SDK" "platforms;android-36" >/dev/null
            fi
          fi

          BT_DIR=""
          if [ -d "$ANDROID_SDK/build-tools" ]; then
            for d in $(ls -1d "$ANDROID_SDK/build-tools"/* 2>/dev/null | sort -V -r); do
              if [ -x "$d/zipalign" ] && [ -x "$d/apksigner" ]; then
                BT_DIR="$d"
                break
              fi
            done
          fi

          if [ -z "$BT_DIR" ]; then
            (yes || true) | "$SDKMANAGER" --sdk_root="$ANDROID_SDK" "build-tools;35.0.0" >/dev/null
            BT_DIR="$ANDROID_SDK/build-tools/35.0.0"
          fi

          echo "ANDROID_HOME=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "$BT_DIR" >> "$GITHUB_PATH"
          echo "sdk_dir=$ANDROID_SDK" >> "$GITHUB_OUTPUT"
          echo "build_tools=$BT_DIR" >> "$GITHUB_OUTPUT"
          echo "Using Android SDK: $ANDROID_SDK (build-tools: $BT_DIR)"

      - name: Verify Live PWA & Build Bubblewrap TWA Manifest
        id: pwa_audit
        env:
          INPUT_PWA_URL: ${{ github.event.inputs.pwa_url }}
          PACKAGE_ID: ${{ github.event.inputs.package_id }}
          APP_VERSION: ${{ github.event.inputs.app_version }}
          APP_VERSION_CODE: ${{ github.event.inputs.app_version_code }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          node <<'EOF'
          const fs = require('node:fs');
          const path = require('node:path');

          async function run() {
            const owner = process.env.REPO_OWNER.toLowerCase();
            const repo = process.env.REPO_NAME;
            const defaultUrl = repo.toLowerCase() === `${owner}.github.io`
              ? `https://${owner}.github.io/`
              : `https://${owner}.github.io/${repo}/`;

            let pwaUrlRaw = (process.env.INPUT_PWA_URL || '').trim() || defaultUrl;
            if (!/^https?:\/\//i.test(pwaUrlRaw)) {
              pwaUrlRaw = `https://${pwaUrlRaw}`;
            }
            if (!pwaUrlRaw.endsWith('/')) {
              pwaUrlRaw += '/';
            }
            const pwaUrl = new URL(pwaUrlRaw);
            console.log(`Auditing live PWA at: ${pwaUrl.href}`);

            // 1. Fetch HTML
            const htmlRes = await fetch(pwaUrl.href, { headers: { Accept: 'text/html' } });
            if (!htmlRes.ok) {
              throw new Error(`Live PWA URL returned HTTP ${htmlRes.status}: ${pwaUrl.href}`);
            }
            const html = await htmlRes.text();

            // 2. Find Web App Manifest link
            const manifestLinkMatch =
              html.match(/<link[^>]+rel=["']manifest["'][^>]+href=["']([^"']+)["']/i) ||
              html.match(/<link[^>]+href=["']([^"']+)["'][^>]+rel=["']manifest["']/i);
            if (!manifestLinkMatch) {
              throw new Error(`No <link rel="manifest"> tag found in ${pwaUrl.href}`);
            }
            const manifestUrl = new URL(manifestLinkMatch[1], pwaUrl);
            const manifestRes = await fetch(manifestUrl.href);
            if (!manifestRes.ok) {
              throw new Error(`Web App Manifest returned HTTP ${manifestRes.status}: ${manifestUrl.href}`);
            }
            const manifest = await manifestRes.json();
            console.log(`Manifest OK: ${manifestUrl.href} (name="${manifest.name}", display="${manifest.display}")`);

            // 3. Verify Service Worker
            const swMatch = html.match(/navigator\.serviceWorker\.register\(\s*['"]([^'"]+)['"]/);
            const swUrl = new URL(swMatch ? swMatch[1] : 'sw.js', pwaUrl);
            const swRes = await fetch(swUrl.href);
            if (!swRes.ok) {
              throw new Error(`Service worker returned HTTP ${swRes.status}: ${swUrl.href}`);
            }
            const swText = await swRes.text();
            if (!swText || swText.trim().length < 20) {
              throw new Error(`Service worker at ${swUrl.href} is empty.`);
            }
            console.log(`Service Worker OK: ${swUrl.href} (${swText.length} bytes)`);

            // 4. Verify PNG icons (any & maskable)
            const icons = Array.isArray(manifest.icons) ? manifest.icons : [];
            const pickIcon = (purpose) => {
              const candidates = icons.filter((ic) => {
                const p = (ic.purpose || 'any').toLowerCase().split(/\s+/);
                return p.includes(purpose) && /png/i.test(ic.type || ic.src || '');
              });
              candidates.sort((a, b) => {
                const sa = parseInt(String(a.sizes || '0').split('x')[0], 10) || 0;
                const sb = parseInt(String(b.sizes || '0').split('x')[0], 10) || 0;
                return sb - sa;
              });
              return candidates[0] || null;
            };

            const mainIcon = pickIcon('any') || icons[0];
            if (!mainIcon || !mainIcon.src) {
              throw new Error('Manifest is missing a valid PNG icon.');
            }
            const maskableIcon = pickIcon('maskable');

            const iconUrl = new URL(mainIcon.src, manifestUrl).href;
            const maskableIconUrl = maskableIcon ? new URL(maskableIcon.src, manifestUrl).href : iconUrl;

            for (const testIcon of new Set([iconUrl, maskableIconUrl])) {
              const iconRes = await fetch(testIcon);
              if (!iconRes.ok) {
                throw new Error(`Icon returned HTTP ${iconRes.status}: ${testIcon}`);
              }
              const buf = Buffer.from(await iconRes.arrayBuffer());
              if (buf.length < 24 || buf.toString('hex', 0, 8) !== '89504e470d0a1a0a') {
                throw new Error(`Icon is not a valid PNG image: ${testIcon}`);
              }
              console.log(`Icon OK: ${testIcon} (${buf.readUInt32BE(16)}x${buf.readUInt32BE(20)} PNG)`);
            }

            // 5. Build Bubblewrap twa-manifest.json
            const startUrlObj = new URL(manifest.start_url || pwaUrl.pathname, manifestUrl);
            const scopeUrlObj = new URL(manifest.scope || pwaUrl.pathname, manifestUrl);
            const versionCode = Math.max(1, parseInt(process.env.APP_VERSION_CODE || '1', 10) || 1);
            const appVersion = (process.env.APP_VERSION || '1.2.0').trim() || '1.2.0';
            const packageId = (process.env.PACKAGE_ID || 'io.github.westonay7.twa').trim();

            const shortcuts = Array.isArray(manifest.shortcuts)
              ? manifest.shortcuts
                  .filter((s) => s && s.name && s.url)
                  .slice(0, 4)
                  .map((s) => {
                    const sIcon = Array.isArray(s.icons) && s.icons[0]?.src
                      ? new URL(s.icons[0].src, manifestUrl).href
                      : iconUrl;
                    return {
                      name: String(s.name),
                      shortName: String(s.short_name || s.name).slice(0, 12),
                      url: new URL(s.url, manifestUrl).pathname,
                      chosenIconUrl: sIcon,
                    };
                  })
              : [];

            const twaManifest = {
              packageId,
              host: pwaUrl.host,
              name: String(manifest.name || 'QuickNote'),
              launcherName: String(manifest.short_name || 'QuickNote').slice(0, 12),
              display: 'standalone',
              displayOverride: ['standalone', 'minimal-ui'],
              themeColor: String(manifest.theme_color || '#5145E5'),
              themeColorDark: '#0F172A',
              navigationColor: '#000000',
              navigationColorDark: '#000000',
              navigationDividerColor: '#000000',
              navigationDividerColorDark: '#000000',
              backgroundColor: String(manifest.background_color || '#F7F7FC'),
              enableNotifications: false,
              startUrl: `${startUrlObj.pathname}${startUrlObj.search}`,
              iconUrl,
              maskableIconUrl,
              splashScreenFadeOutDuration: 300,
              signingKey: {
                path: path.resolve('twa-work/android.keystore'),
                alias: 'quicknote',
              },
              appVersionCode: versionCode,
              appVersion,
              shortcuts,
              generatorApp: 'bubblewrap-cli',
              webManifestUrl: manifestUrl.href,
              fallbackType: 'customtabs',
              features: {},
              alphaDependencies: { enabled: false },
              enableSiteSettingsShortcut: true,
              isChromeOSOnly: false,
              isMetaQuest: false,
              fullScopeUrl: scopeUrlObj.href,
              minSdkVersion: 21,
              orientation: 'any',
              fingerprints: [],
              additionalTrustedOrigins: [],
              retainedBundles: [],
            };

            fs.mkdirSync('twa-work', { recursive: true });
            fs.writeFileSync('twa-work/twa-manifest.json', JSON.stringify(twaManifest, null, 2));

            const out = process.env.GITHUB_OUTPUT;
            if (out) {
              fs.appendFileSync(out, `pwa_url=${pwaUrl.href}\n`);
              fs.appendFileSync(out, `manifest_url=${manifestUrl.href}\n`);
              fs.appendFileSync(out, `sw_url=${swUrl.href}\n`);
              fs.appendFileSync(out, `package_id=${packageId}\n`);
              fs.appendFileSync(out, `app_version=${appVersion}\n`);
              fs.appendFileSync(out, `app_version_code=${versionCode}\n`);
            }
          }

          run().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          EOF

      - name: Generate Android TWA project with Google Bubblewrap
        env:
          ANDROID_SDK: ${{ steps.android_sdk.outputs.sdk_dir }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.bubblewrap" twa-work/project
          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_SDK}"
          }
          EOF

          npx --yes @bubblewrap/cli update \
            --skipVersionUpgrade \
            --manifest twa-work/twa-manifest.json \
            --directory twa-work/project

          printf 'sdk.dir=%s\n' "$ANDROID_SDK" > twa-work/project/local.properties

      - name: Compile Release Android APK
        run: |
          set -euo pipefail
          cd twa-work/project
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Align, Sign, and Verify Android APK
        id: sign_step
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          RAW_APK="twa-work/project/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$RAW_APK" ]; then
            echo "::error::Compiled release APK not found at $RAW_APK"
            exit 1
          fi

          # Align to 4-byte boundaries and 4096-byte page boundaries (required on Android 11+)
          zipalign -p -f 4 "$RAW_APK" twa-work/aligned.apk
          zipalign -c -p 4 twa-work/aligned.apk

          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > twa-work/release.keystore
            KS_PATH="twa-work/release.keystore"
            KS_ALIAS="$ANDROID_KEY_ALIAS"
            KS_PASS="$ANDROID_KEYSTORE_PASSWORD"
            KEY_PASS="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
            SIGNING_MODE="repository-secret-keystore"
          else
            KS_PATH="twa-work/ephemeral-release.keystore"
            KS_ALIAS="quicknote"
            KS_PASS="$(openssl rand -hex 24)"
            KEY_PASS="$KS_PASS"
            echo "::add-mask::$KS_PASS"

            keytool -genkeypair -v \
              -keystore "$KS_PATH" \
              -storetype PKCS12 \
              -alias "$KS_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KS_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=QuickNote, OU=Mobile, O=QuickNote, L=Internet, S=NA, C=US" \
              >/dev/null 2>&1
            SIGNING_MODE="ephemeral-release-keystore"
          fi

          mkdir -p twa-work/output
          apksigner sign \
            --ks "$KS_PATH" \
            --ks-key-alias "$KS_ALIAS" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out twa-work/output/QuickNote-signed.apk \
            twa-work/aligned.apk

          rm -f twa-work/release.keystore twa-work/ephemeral-release.keystore

          VERIFY_OUT="$(apksigner verify --verbose --print-certs twa-work/output/QuickNote-signed.apk)"
          echo "$VERIFY_OUT"

          SHA256_RAW="$(echo "$VERIFY_OUT" | grep -m1 'certificate SHA-256 digest:' | awk '{print $NF}' || true)"
          SHA256_COLON="$(echo "$SHA256_RAW" | tr '[:lower:]' '[:upper:]' | sed 's/../&:/g;s/:$//')"

          echo "signing_mode=$SIGNING_MODE" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256_COLON" >> "$GITHUB_OUTPUT"

      - name: Upload QuickNote-signed.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickNote-signed-apk
          path: twa-work/output/QuickNote-signed.apk
          retention-days: 30

      - name: Attach APK to GitHub Release (Optional)
        if: github.event.inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.inputs.release_tag }}
          APP_VERSION: ${{ steps.pwa_audit.outputs.app_version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" twa-work/output/QuickNote-signed.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG_NAME" twa-work/output/QuickNote-signed.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "QuickNote Android v${APP_VERSION}" \
              --notes "Signed Android TWA APK built directly with Google Bubblewrap (aligned + verified with Android v1/v2/v3 signatures)."
          fi

      - name: Write Build & PWA Summary
        env:
          PWA_URL: ${{ steps.pwa_audit.outputs.pwa_url }}
          MANIFEST_URL: ${{ steps.pwa_audit.outputs.manifest_url }}
          SW_URL: ${{ steps.pwa_audit.outputs.sw_url }}
          PACKAGE_ID: ${{ steps.pwa_audit.outputs.package_id }}
          APP_VERSION: ${{ steps.pwa_audit.outputs.app_version }}
          APP_VERSION_CODE: ${{ steps.pwa_audit.outputs.app_version_code }}
          SIGNING_MODE: ${{ steps.sign_step.outputs.signing_mode }}
          SHA256: ${{ steps.sign_step.outputs.sha256 }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          {
            echo "## QuickNote Android APK Built & Verified"
            echo ""
            echo "Built directly with Google Bubblewrap (no PWABuilder server required)."
            echo ""
            echo "### PWA Audit"
            echo "- **Live URL:** ${PWA_URL} (200 OK)"
            echo "- **Web App Manifest:** ${MANIFEST_URL} (Valid JSON + PNG icons)"
            echo "- **Service Worker:** ${SW_URL} (200 OK)"
            echo ""
            echo "### Signed Android APK"
            echo "- **Artifact:** \`QuickNote-signed-apk\` -> \`QuickNote-signed.apk\` (aligned + Android v1/v2/v3 verified)"
            echo "- **Package ID:** \`${PACKAGE_ID}\`"
            echo "- **Version:** \`${APP_VERSION}\` (versionCode \`${APP_VERSION_CODE}\`)"
            echo "- **Signing Mode:** \`${SIGNING_MODE}\`"
            if [ -n "$SHA256" ]; then
              echo "- **SHA-256 Certificate Fingerprint:** \`${SHA256}\`"
            fi
            if [ -n "$RELEASE_TAG" ]; then
              echo "- **GitHub Release:** \`${RELEASE_TAG}\` (APK attached)"
            fi
            echo ""
            echo "Download **\`QuickNote-signed-apk\`** from the **Artifacts** section below, unzip it, and install **\`QuickNote-signed.apk\`** on your Android phone."
            if [ "$SIGNING_MODE" = "ephemeral-release-keystore" ]; then
              echo ""
              echo "> **Tip for future updates & TWA verification:** To keep the exact same signing key and SHA-256 fingerprint across builds, save your keystore in GitHub Repository Secrets (\`ANDROID_KEYSTORE_BASE64\`, \`ANDROID_KEYSTORE_PASSWORD\`, \`ANDROID_KEY_ALIAS\`, \`ANDROID_KEY_PASSWORD\`)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
