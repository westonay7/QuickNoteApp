name: Build & Release Signed QuickNote Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Version tag for the GitHub Release (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate persistent signing key secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          MISSING=()
          [ -z "$ANDROID_KEYSTORE_BASE64" ] && MISSING+=("ANDROID_KEYSTORE_BASE64")
          [ -z "$ANDROID_KEYSTORE_PASSWORD" ] && MISSING+=("ANDROID_KEYSTORE_PASSWORD")
          [ -z "$ANDROID_KEY_ALIAS" ] && MISSING+=("ANDROID_KEY_ALIAS")
          [ -z "$ANDROID_KEY_PASSWORD" ] && MISSING+=("ANDROID_KEY_PASSWORD")

          if [ "${#MISSING[@]}" -gt 0 ]; then
            echo "::error::Missing required GitHub Actions signing secrets: ${MISSING[*]}"
            echo "This workflow requires a persistent Android signing keystore configured in GitHub Repository Secrets (Settings -> Secrets and variables -> Actions) and will never generate a temporary/ephemeral key."
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Decode and verify persistent keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          KEYSTORE_FILE="$RUNNER_TEMP/quicknote-release.keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"

          keytool -list \
            -keystore "$KEYSTORE_FILE" \
            -alias "$ANDROID_KEY_ALIAS" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            >/dev/null

          echo "Persistent keystore verified for alias '$ANDROID_KEY_ALIAS'."

      - name: Prepare Android SDK & build-tools
        id: android_sdk
        run: |
          set -euo pipefail
          ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$ANDROID_SDK" ]; then
            echo "::error::Android SDK directory was not found at $ANDROID_SDK."
            exit 1
          fi

          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager")"
          if [ -x "$SDKMANAGER" ]; then
            (yes || true) | "$SDKMANAGER" --sdk_root="$ANDROID_SDK" --licenses >/dev/null 2>&1 || true
            if [ ! -d "$ANDROID_SDK/platforms/android-36" ]; then
              (yes || true) | "$SDKMANAGER" --sdk_root="$ANDROID_SDK" "platforms;android-36" >/dev/null
            fi
          fi

          BT_DIR=""
          if [ -d "$ANDROID_SDK/build-tools" ]; then
            for d in $(ls -1d "$ANDROID_SDK/build-tools"/* 2>/dev/null | sort -V -r); do
              if [ -x "$d/zipalign" ] && [ -x "$d/apksigner" ]; then
                BT_DIR="$d"
                break
              fi
            done
          fi

          if [ -z "$BT_DIR" ]; then
            (yes || true) | "$SDKMANAGER" --sdk_root="$ANDROID_SDK" "build-tools;35.0.0" >/dev/null
            BT_DIR="$ANDROID_SDK/build-tools/35.0.0"
          fi

          echo "ANDROID_HOME=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "$BT_DIR" >> "$GITHUB_PATH"
          echo "sdk_dir=$ANDROID_SDK" >> "$GITHUB_OUTPUT"
          echo "Using Android SDK: $ANDROID_SDK (build-tools: $BT_DIR)"

      - name: Resolve release version and verify Bubblewrap TWA configuration
        id: release_meta
        env:
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            TAG_NAME="${INPUT_TAG}"
          fi

          if [ -z "$TAG_NAME" ]; then
            echo "::error::Could not determine version tag."
            exit 1
          fi

          VERSION_NAME="${TAG_NAME#v}"
          if [[ "$VERSION_NAME" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            VERSION_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          else
            VERSION_CODE="${GITHUB_RUN_NUMBER}"
          fi

          # Verify package ID consistency between Bubblewrap twa-manifest.json and Digital Asset Links
          TWA_PKG="$(node -e "console.log(JSON.parse(require('fs').readFileSync('android/twa-manifest.json','utf8')).packageId)")"
          DAL_PKG="$(node -e "console.log(JSON.parse(require('fs').readFileSync('public/.well-known/assetlinks.json','utf8'))[0].target.package_name)")"
          DAL_FP="$(node -e "console.log(JSON.parse(require('fs').readFileSync('public/.well-known/assetlinks.json','utf8'))[0].target.sha256_cert_fingerprints[0])")"

          if [ "$TWA_PKG" != "$DAL_PKG" ]; then
            echo "::error::Package ID mismatch: android/twa-manifest.json ($TWA_PKG) != public/.well-known/assetlinks.json ($DAL_PKG)"
            exit 1
          fi

          # Apply tag versionName and versionCode to the Bubblewrap Gradle build
          node -e '
            const fs = require("node:fs");
            const file = "android/app/build.gradle";
            let gradle = fs.readFileSync(file, "utf8");
            gradle = gradle.replace(/versionCode\s+\d+/, `versionCode ${process.argv[1]}`);
            gradle = gradle.replace(/versionName\s+"[^"]*"/, `versionName "${process.argv[2]}"`);
            fs.writeFileSync(file, gradle);
          ' "$VERSION_CODE" "$VERSION_NAME"

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "package_id=$TWA_PKG" >> "$GITHUB_OUTPUT"
          echo "assetlinks_sha256=$DAL_FP" >> "$GITHUB_OUTPUT"
          echo "Building QuickNote TWA ($TWA_PKG) version $VERSION_NAME (versionCode $VERSION_CODE) for tag $TAG_NAME"

      - name: Compile Release Android APK with Gradle
        env:
          ANDROID_SDK: ${{ steps.android_sdk.outputs.sdk_dir }}
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\n' "$ANDROID_SDK" > android/local.properties
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Align, Sign, and Verify QuickNote.apk
        id: sign_step
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_PKG: ${{ steps.release_meta.outputs.package_id }}
          EXPECTED_SHA256: ${{ steps.release_meta.outputs.assetlinks_sha256 }}
        run: |
          set -euo pipefail
          RAW_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$RAW_APK" ]; then
            echo "::error::Compiled release APK not found at $RAW_APK"
            exit 1
          fi

          ALIGNED_APK="$RUNNER_TEMP/QuickNote-aligned.apk"
          SIGNED_APK="$RUNNER_TEMP/QuickNote.apk"
          KEYSTORE_FILE="$RUNNER_TEMP/quicknote-release.keystore"

          # Align to 4-byte boundaries and 4096-byte page boundaries (required on Android 11+)
          zipalign -p -f 4 "$RAW_APK" "$ALIGNED_APK"
          zipalign -c -p 4 "$ALIGNED_APK"

          # Sign with Android v1, v2, and v3 signature schemes using the persistent keystore
          apksigner sign \
            --ks "$KEYSTORE_FILE" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          VERIFY_OUT="$(apksigner verify --verbose --print-certs "$SIGNED_APK")"
          echo "$VERIFY_OUT"

          SHA256_RAW="$(echo "$VERIFY_OUT" | grep -m1 'certificate SHA-256 digest:' | awk '{print $NF}' || true)"
          SHA256_COLON="$(echo "$SHA256_RAW" | tr '[:lower:]' '[:upper:]' | sed 's/../&:/g;s/:$//')"

          if command -v aapt2 >/dev/null 2>&1; then
            BADGING="$(aapt2 dump badging "$SIGNED_APK" 2>/dev/null | head -n 1 || true)"
            echo "APK badging: $BADGING"
            ACTUAL_PKG="$(echo "$BADGING" | sed -n "s/.*name='\([^']*\)'.*/\1/p")"
            if [ -n "$ACTUAL_PKG" ] && [ "$ACTUAL_PKG" != "$EXPECTED_PKG" ]; then
              echo "::error::Built APK package ID ($ACTUAL_PKG) does not match expected ($EXPECTED_PKG)"
              exit 1
            fi
          fi

          FP_MATCH="unknown"
          if [ -n "$SHA256_COLON" ] && [ -n "$EXPECTED_SHA256" ]; then
            if [ "$SHA256_COLON" = "$EXPECTED_SHA256" ]; then
              FP_MATCH="matched"
              echo "SHA-256 certificate fingerprint matches public/.well-known/assetlinks.json."
            else
              FP_MATCH="mismatch"
              echo "::warning::Signing key SHA-256 ($SHA256_COLON) differs from public/.well-known/assetlinks.json ($EXPECTED_SHA256). Update assetlinks.json or use the matching keystore so TWA verification removes the browser bar."
            fi
          fi

          echo "apk_path=$SIGNED_APK" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256_COLON" >> "$GITHUB_OUTPUT"
          echo "fp_match=$FP_MATCH" >> "$GITHUB_OUTPUT"

      - name: Upload QuickNote.apk Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickNote-apk
          path: ${{ steps.sign_step.outputs.apk_path }}
          retention-days: 30

      - name: Attach QuickNote.apk to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release_meta.outputs.tag_name }}
          VERSION_NAME: ${{ steps.release_meta.outputs.version_name }}
          APK_PATH: ${{ steps.sign_step.outputs.apk_path }}
          PACKAGE_ID: ${{ steps.release_meta.outputs.package_id }}
          SHA256: ${{ steps.sign_step.outputs.sha256 }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$APK_PATH" --repo "$GITHUB_REPOSITORY" --clobber
          else
            NOTES_FILE="$RUNNER_TEMP/release-notes.md"
            {
              echo "Signed Android Trusted Web Activity APK built with Google Bubblewrap."
              echo ""
              echo "- **Package ID:** \`${PACKAGE_ID}\`"
              echo "- **Version:** \`${VERSION_NAME}\`"
              echo "- **SHA-256 Fingerprint:** \`${SHA256}\`"
              echo "- **Direct Download:** https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/QuickNote.apk"
            } > "$NOTES_FILE"
            gh release create "$TAG_NAME" "$APK_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "QuickNote Android ${TAG_NAME}" \
              --notes-file "$NOTES_FILE"
          fi

      - name: Write Release Summary
        env:
          TAG_NAME: ${{ steps.release_meta.outputs.tag_name }}
          VERSION_NAME: ${{ steps.release_meta.outputs.version_name }}
          VERSION_CODE: ${{ steps.release_meta.outputs.version_code }}
          PACKAGE_ID: ${{ steps.release_meta.outputs.package_id }}
          SHA256: ${{ steps.sign_step.outputs.sha256 }}
          FP_MATCH: ${{ steps.sign_step.outputs.fp_match }}
        run: |
          {
            echo "## QuickNote Android APK Released"
            echo ""
            echo "- **Release Tag:** \`${TAG_NAME}\`"
            echo "- **APK File:** \`QuickNote.apk\` (aligned + Android v1/v2/v3 verified)"
            echo "- **Package ID:** \`${PACKAGE_ID}\`"
            echo "- **Version:** \`${VERSION_NAME}\` (versionCode \`${VERSION_CODE}\`)"
            echo "- **SHA-256 Certificate Fingerprint:** \`${SHA256}\`"
            echo "- **Digital Asset Links Check:** \`${FP_MATCH}\`"
            echo "- **Direct APK Download URL:** https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/QuickNote.apk"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up temporary keystore
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/quicknote-release.keystore" "$RUNNER_TEMP/QuickNote-aligned.apk" android/local.properties
